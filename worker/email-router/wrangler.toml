name = "pai-email-router"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables (non-secret)
[vars]
ENVIRONMENT = "production"
JWT_ISSUER = "pai-email-agent"
JWT_AUDIENCE = "pai-agents"
DOMAIN = "axiomid.app"
AGENT_EMAIL_DOMAIN = "agents.axiomid.app"
WEBHOOK_TIMEOUT_MS = "5000"
WEBHOOK_MAX_RETRIES = "3"
WEBHOOK_RETRY_DELAY_MS = "1000"

# KV Namespaces
[[kv_namespaces]]
binding = "EMAIL_KV"
id = "<EMAIL_KV_ID>"
preview_id = "<EMAIL_KV_PREVIEW_ID>"

[[kv_namespaces]]
binding = "AGENT_KV"
id = "<AGENT_KV_ID>"
preview_id = "<AGENT_KV_PREVIEW_ID>"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "<RATE_LIMIT_KV_ID>"
preview_id = "<RATE_LIMIT_KV_PREVIEW_ID>"

[[kv_namespaces]]
binding = "WEBHOOK_KV"
id = "<WEBHOOK_KV_ID>"
preview_id = "<WEBHOOK_KV_PREVIEW_ID>"

# Durable Objects
[[durable_objects.bindings]]
name = "AGENT_INBOX_DO"
class_name = "AgentInboxDO"

# Email Routing Trigger
[triggers]
email = true

# Build

# [env.staging]
# [env.production]