[package]
name = "pai-email-agent"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for PAI Email Agent - Zero-cost email infrastructure for AI agents"
license = "MIT"
repository = "https://github.com/pai-list/PAI-Email-Agent"
keywords = ["email", "agent", "cloudflare", "resend", "pai"]
categories = ["email", "network-programming", "wasm"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
ed25519-dalek = "2.0"
x25519-dalek = "2.0"

[features]
default = []
wasm = ["reqwest/wasm", "tokio/std"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1